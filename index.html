<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>British Landmarks Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- Main Container -->
  <div class="max-w-4xl w-mx-auto w-full mx-auto">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 bg-[#131b2e] p-4 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-xl">
          🇬🇧
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-white leading-tight">British Landmarks Quest</h1>
          <p class="text-xs text-slate-400">England Landmarks Presentation Edition • 8th Grade English</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="bg-[#1a243b] px-4 py-2 rounded-xl border border-slate-700/60 text-sm font-semibold text-indigo-300">
          🏆 SCORE <span id="score" class="text-white ml-1 font-bold">0/5</span>
        </div>
        <button onclick="restartQuiz()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm px-3 py-2 rounded-xl transition border border-slate-700">
          🔄 Restart
        </button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="mb-6 bg-[#131b2e] p-3 rounded-xl border border-slate-800">
      <div class="flex justify-between text-xs font-semibold text-slate-400 mb-2">
        <span id="question-number">Question 1 of 5</span>
        <span id="topic-tag" class="text-indigo-400">Theme: Iconic London & UK</span>
      </div>
      <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
        <div id="progress" class="bg-indigo-500 h-full transition-all duration-300" style="width: 20%"></div>
      </div>
    </div>

    <!-- Quiz Box -->
    <div id="quiz-box" class="bg-[#131b2e] rounded-2xl border border-slate-800 p-5 sm:p-6 shadow-xl">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-md">
          IDENTIFY THE LANDMARK
        </span>
        <span id="q-counter" class="text-xs font-semibold text-slate-400">1/5</span>
      </div>

      <h2 id="question-text" class="text-lg sm:text-xl font-bold text-white mb-5 leading-snug"></h2>

      <!-- Image Display -->
      <div class="relative w-full h-64 sm:h-80 rounded-xl overflow-hidden mb-6 bg-[#0b0f19] border border-slate-800 flex items-center justify-center">
        <img id="landmark-img" src="" alt="Landmark" class="w-full h-full object-cover hidden transition-opacity duration-300" />
        <div id="loader" class="text-slate-500 text-sm flex flex-col items-center gap-2">
          <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
          <span>Loading image...</span>
        </div>
      </div>

      <!-- Options Grid -->
      <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4"></div>

      <!-- Feedback Box -->
      <div id="feedback-box" class="hidden p-4 rounded-xl text-sm font-medium border mb-2"></div>
      
      <!-- Next Button -->
      <div class="flex justify-end mt-4">
        <button id="next-btn" onclick="nextQuestion()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-6 rounded-xl transition text-sm">
          Next Landmark →
        </button>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-box" class="hidden bg-[#131b2e] rounded-2xl border border-slate-800 p-8 text-center shadow-xl">
      <div class="text-5xl mb-3">👑</div>
      <h2 class="text-2xl font-bold text-white mb-2">Presentation Quest Completed!</h2>
      <p id="final-score" class="text-slate-300 text-lg mb-6"></p>
      <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl transition shadow-lg text-sm">
        Play Again 🔄
      </button>
    </div>

  </div>

  <script>
    const questions = [
      {
        question: "Identify this famous clock tower located at the Houses of Parliament in London:",
        image: "https://images.unsplash.com/photo-1529655683826-aba9b3e77383?auto=format&fit=crop&w=1000&q=80",
        options: ["London Eye", "Big Ben", "Tower Bridge", "St Paul's Cathedral"],
        answer: 1,
        fact: "Big Ben is actually the nickname for the Great Bell of the striking clock at the north end of the Palace of Westminster!"
      },
      {
        question: "Identify this iconic suspension and bascule bridge crossing the River Thames:",
        image: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1000&q=80",
        options: ["London Bridge", "Golden Gate Bridge", "Tower Bridge", "Westminster Bridge"],
        answer: 2,
        fact: "Tower Bridge was built between 1886 and 1894 and is one of the most recognizable landmarks in London."
      },
      {
        question: "Identify this ancient prehistoric stone monument located in Wiltshire, England:",
        image: "https://images.unsplash.com/photo-1508807526345-15e9b5f4eaff?auto=format&fit=crop&w=1000&q=80",
        options: ["Stonehenge", "Roman Baths", "Hadrian's Wall", "Giant's Causeway"],
        answer: 0,
        fact: "Stonehenge was constructed around 3000 BC to 2000 BC and remains one of Britain's greatest historical mysteries."
      },
      {
        question: "Identify the official London residence and administrative headquarters of the Royal Monarch:",
        image: "https://images.unsplash.com/photo-1543832923-44667a44c804?auto=format&fit=crop&w=1000&q=80",
        options: ["Windsor Castle", "Buckingham Palace", "Kensington Palace", "Tower of London"],
        answer: 1,
        fact: "Buckingham Palace has 775 rooms, including 19 State rooms, 52 Royal and guest bedrooms, and 78 bathrooms!"
      },
      {
        question: "Identify this giant observation wheel located on the South Bank of the River Thames:",
        image: "https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1000&q=80",
        options: ["London Eye", "The Millennium Wheel", "SkyView Wheel", "London Star"],
        answer: 0,
        fact: "The London Eye stands 135 meters tall and is the most popular paid tourist attraction in the United Kingdom."
      }
    ];

    let currentQ = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
      answered = false;
      const q = questions[currentQ];
      
      document.getElementById("question-number").textContent = `Question ${currentQ + 1} of ${questions.length}`;
      document.getElementById("q-counter").textContent = `${currentQ + 1}/${questions.length}`;
      document.getElementById("progress").style.width = `${((currentQ + 1) / questions.length) * 100}%`;
      document.getElementById("question-text").textContent = q.question;
      
      const img = document.getElementById("landmark-img");
      const loader = document.getElementById("loader");
      img.classList.add("hidden");
      loader.classList.remove("hidden");
      
      img.src = q.image;
      img.onload = () => {
        loader.classList.add("hidden");
        img.classList.remove("hidden");
      };

      const optionsGrid = document.getElementById("options-grid");
      optionsGrid.innerHTML = "";
      document.getElementById("feedback-box").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");

      const prefixes = ["A", "B", "C", "D"];
      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full p-3.5 rounded-xl text-left bg-[#1a243b] hover:bg-[#222f4d] border border-slate-700/80 text-slate-200 font-medium transition flex items-center gap-3 text-sm";
        btn.innerHTML = `<span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 flex items-center justify-center font-semibold text-xs">${prefixes[idx]}</span> ${opt}`;
        btn.onclick = () => selectOption(idx, btn);
        optionsGrid.appendChild(btn);
      });
    }

    function selectOption(idx, btn) {
      if (answered) return;
      answered = true;

      const q = questions[currentQ];
      const allBtns = document.querySelectorAll("#options-grid button");
      allBtns.forEach(b => b.disabled = true);

      const feedback = document.getElementById("feedback-box");
      feedback.classList.remove("hidden");

      if (idx === q.answer) {
        score++;
        document.getElementById("score").textContent = `${score}/${questions.length}`;
        btn.className = "w-full p-3.5 rounded-xl text-left bg-emerald-500/20 border border-emerald-500 text-emerald-300 font-medium flex items-center gap-3 text-sm";
        feedback.className = "p-4 rounded-xl text-sm font-medium bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 mb-2";
        feedback.innerHTML = `<strong>Correct!</strong> ${q.fact}`;
      } else {
        btn.className = "w-full p-3.5 rounded-xl text-left bg-rose-500/20 border border-rose-500 text-rose-300 font-medium flex items-center gap-3 text-sm";
        allBtns[q.answer].className = "w-full p-3.5 rounded-xl text-left bg-emerald-500/20 border border-emerald-500 text-emerald-300 font-medium flex items-center gap-3 text-sm";
        feedback.className = "p-4 rounded-xl text-sm font-medium bg-rose-500/10 border border-rose-500/30 text-rose-300 mb-2";
        feedback.innerHTML = `<strong>Incorrect!</strong> ${q.fact}`;
      }

      document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quiz-box").classList.add("hidden");
      const resultBox = document.getElementById("result-box");
      resultBox.classList.remove("hidden");
      document.getElementById("final-score").textContent = `You scored ${score} out of ${questions.length} on the British Landmarks Quiz!`;

      if (score >= 4) {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }

    function restartQuiz() {
      currentQ = 0;
      score = 0;
      document.getElementById("score").textContent = `0/${questions.length}`;
      document.getElementById("result-box").classList.add("hidden");
      document.getElementById("quiz-box").classList.remove("hidden");
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
